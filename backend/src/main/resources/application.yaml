spring:
  application:
    name: gohub


  datasource:
    url: jdbc:postgresql://localhost:5432/gohub
    username: postgres
    password: pass@123
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  server:
    port:8080
